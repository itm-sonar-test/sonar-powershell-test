name: SonarCloud

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA per githubactions:S7637 (tags are mutable, SHAs are not).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disable shallow clone so blame info is available for Sonar.
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.x

      # The .NET scanner is required for C#. Sonar's C# analyzer is a Roslyn
      # analyzer, so it needs the compiler's syntax tree and symbol resolution -
      # the generic CLI scanner cannot produce that and silently indexes no C#
      # files at all. begin injects the analyzers, build runs them, end uploads.
      # Other languages present (PowerShell, YAML) are still picked up by end.
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"itm-sonar-test_sonar-powershell-test" \
            /o:"itm-sonar-test" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN"
          dotnet build src/InventoryService.csproj --no-incremental
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
