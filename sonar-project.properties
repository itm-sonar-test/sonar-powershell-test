sonar.projectKey=itm-sonar-test_sonar-powershell-test
sonar.organization=itm-sonar-test

# Scan the whole repository.
sonar.sources=.

# C# is present but will not be analysed by the CLI scanner - C# requires the
# dotnet scanner with a real build, and there is no project or solution file
# here. Left in place deliberately so the gap is visible in the results.
sonar.exclusions=**/bin/**,**/obj/**

sonar.sourceEncoding=UTF-8
